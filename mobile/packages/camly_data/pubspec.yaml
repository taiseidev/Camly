name: camly_data
description: Provides implementations for data layer logic, including API clients and repository implementations.
publish_to: 'none'
version: 0.0.1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  camly_system:
    path: ../../packages/camly_system
  camly_di:
    path: ../../packages/camly_di
  camly_domain:
    path: ../../packages/camly_domain
  camly_lints:
    path: ../../packages/camly_lints
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
 build_runner: ^2.4.13
 freezed: ^2.5.7
 json_serializable: ^6.9.0
 riverpod_generator: ^2.6.3
